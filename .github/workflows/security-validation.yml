name: Security and upgrade validation
on:
  workflow_dispatch:
  push:
    branches: [fix/security-hardening]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run prepare:electron
      - name: Dependency audit (non-blocking)
        run: npm audit --audit-level=low || true
      - run: npm run lint
      - run: npm test
      - run: npm run build:renderer
      - run: node --test --test-concurrency=4 e2e/*.e2e.test.js
      - run: npx electron-builder --win nsis --x64 --publish never --config.npmRebuild=false
      - name: Test packaged terminal
        run: node --test e2e/desktop.e2e.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-security-validation
          path: |
            release/*-setup.exe
            release/*-setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error
