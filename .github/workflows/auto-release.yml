name: Publication automatique

# Chaque modification livrée reçoit sa version et sa release Windows :
# un push sur main déclenche la création de la fiche GitHub (tag v<version> de
# package.json) puis le build Windows qui y dépose ses fichiers.
# La fiche est créée en brouillon : elle n'est publiée qu'une fois les quatre
# artefacts (installateur, .blockmap, latest.yml, SHA256SUMS.txt) déposés, pour
# qu'aucun utilisateur ne voie une release sans installateur.
# Une release publiée existante n'est jamais modifiée ; un brouillon laissé par
# un build interrompu relance uniquement le job Windows pour le compléter.
# Une panne du job `publish` lance quand même le build Windows (version lue
# dans package.json) : les artefacts peuvent être déposés et la fiche complétée
# à la main, alors qu'un job ignoré ne produit rien.
# Le dépôt étant privé, l'API publique renvoie 404 : seule la page Actions
# (connectée) permet de voir ces exécutions.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version à publier (laisser vide pour package.json)
        required: false
        type: string
permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      created: ${{ steps.release.outputs.created }}
      draft: ${{ steps.release.outputs.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la version et créer la release si nécessaire
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # CRLF éventuel dans package.json : on nettoie le tag pour que
          # `gh release create` reçoive exactement v<version>.
          package_version=$(node -p "require('./package.json').version" | tr -d '\r\n')
          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            version="$package_version"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version invalide : $version" >&2
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Valeurs par défaut : `set -u` empêcherait toute sortie non écrite
          # d'être lue par le job Windows (condition vide = job ignoré).
          echo "created=false" >> "$GITHUB_OUTPUT"
          echo "draft=false" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            # Un brouillon signale un build interrompu : on relance le workflow
            # Windows pour le compléter. Une release publiée n'est jamais modifiée.
            draft=$(gh release view "$tag" --repo "$GH_REPO" --json isDraft --jq '.isDraft')
            echo "La release $tag existe déjà (brouillon=$draft)."
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "draft=$draft" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag_remote_sha=$(git ls-remote --tags origin "refs/tags/$tag" | tr -d '\r' | awk '{print $1}')
          if [ -n "$tag_remote_sha" ] && [ "$tag_remote_sha" != "$HEAD_SHA" ]; then
            if ! git merge-base --is-ancestor "$tag_remote_sha" "$HEAD_SHA" 2>/dev/null; then
              echo "Le tag $tag existe sans release sur un commit étranger ($tag_remote_sha vs $HEAD_SHA) : publication manuelle requise." >&2
              exit 1
            fi
            echo "Le tag $tag existe déjà sur un commit ancêtre ($tag_remote_sha) : suppression du tag distant pour recréer la release sur $HEAD_SHA."
            git push origin ":refs/tags/$tag" || true
          fi
          # Les releases lancées manuellement avec une version différente de
          # package.json doivent utiliser le commit actuellement contrôlé.
          # Ne pas créer un tag de version courante sur une ancienne ref/tag.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publication refusée depuis $GITHUB_REF : lancer depuis main." >&2
            exit 1
          fi
          if [ "$version" != "$package_version" ]; then
            echo "La version demandée ($version) ne correspond pas à package.json ($package_version)." >&2
            echo "Mets à jour package.json, le changelog et le résumé, puis pousse sur main." >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          # Le résumé est facultatif : un échec ici ne doit pas empêcher la release.
          body=$(node scripts/release-body.js "$version" || true)
          if [ -z "$body" ]; then
            body="FranceStudent Code Roblox $version. Installateur Windows 64 bits : FranceStudentCodeRoblox-$version-setup.exe."
          fi
          gh release create "$tag" \
            --repo "$GH_REPO" \
            --target "$HEAD_SHA" \
            --title "FranceStudent Code Roblox $version" \
            --notes "$body" \
            --draft \
            --prerelease="$prerelease"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "draft=true" >> "$GITHUB_OUTPUT"

  windows:
    needs: publish
    # Lancer le build Windows quand la fiche vient d'être créée ou reste en
    # brouillon (build interrompu), et même si le job `publish` a échoué : le
    # workflow Windows relit alors la version dans package.json, envoie les
    # artefacts et complète la fiche. Un échec du job `publish` ne doit pas
    # laisser une version non construite.
    if: >-
      !cancelled() &&
      (needs.publish.result != 'success' ||
       needs.publish.outputs.created == 'true' ||
       needs.publish.outputs.draft == 'true')
    uses: ./.github/workflows/release-win.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    permissions:
      contents: write
