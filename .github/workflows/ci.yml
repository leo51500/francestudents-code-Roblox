name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run prepare:electron
      - run: npm audit --audit-level=low
      - run: npm run build:renderer
      - run: npm run lint
      - run: npm run check:renderer
      - run: npm test
      - uses: ./.github/actions/build-effectcraft
      - run: npm run build:desktop
