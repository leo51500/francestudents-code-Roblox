name: Publier les exécutables Windows

on:
  # Déclenché par la fiche de release (auto-release.yml appelle ce workflow
  # via `workflow_call`, y compris depuis le jeton automatique Actions).
  workflow_call:
    inputs:
      tag:
        description: Tag de la release à publier (ex. v1.5.7)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de la release existante (ex. v1.1.2)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # Windows x64 : onnxruntime-node fournit déjà ses binaires CPU dans le paquet.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Un tag vide (job `publish` en échec) est remplacé par la version de
      # package.json, lue juste après le checkout sur le SHA déclencheur (ou sur
      # la tête de main pour un lancement manuel sans tag).
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier le tag et les fichiers déjà publiés
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            $env:RELEASE_TAG = "v$version"
            "RELEASE_TAG=$($env:RELEASE_TAG)" >> $env:GITHUB_ENV
          }
          if ($env:RELEASE_TAG -ne "v$version") { throw "Le tag doit correspondre à package.json : v$version" }
          # La lecture peut échouer sans que l'étape entière ne s'arrête : la
          # réponse vide et le code de sortie sont testés explicitement pour
          # produire un message clair au lieu d'une exception du lanceur.
          $releaseJson = $null
          $ErrorActionPreference = "Continue"
          $releaseJson = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets,isPrerelease,isDraft
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($releaseJson -join ""))) {
            throw "Release $($env:RELEASE_TAG) introuvable ou inaccessible. Une release publiée existante n'est jamais modifiée : relance le workflow de publication."
          }
          $release = $releaseJson | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object { $_.name })
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $installer = $package.build.nsis.artifactName.Replace('${version}', $version)
          $required = @($installer, "$installer.blockmap", "latest.yml", "SHA256SUMS.txt")
          $missing = @($required | Where-Object { $_ -notin $names })
          "ready=$($missing.Count -eq 0)".ToLower() >> $env:GITHUB_OUTPUT
      - name: Installer et vérifier
        if: steps.release.outputs.ready != 'true'
        run: |
          # Même préparation qu'en CI : installer, puis charger Electron avant
          # toute autre commande. `npm test` appelle `node -e "require('electron')"`
          # (via prepare:electron) et échoue si le binaire n'est pas téléchargé.
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run prepare:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Seules les dependances livrees gardent un seuil bloquant : un avis sur
          # l'outillage de build, sans correctif publie en amont, ne doit pas
          # empecher la sortie de l'installateur.
          npm audit --omit=dev --audit-level=low
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:renderer-globals
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:tokens
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:renderer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Détecter le certificat de signature
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          # Le secret n'est exposé qu'à cette étape : les suivantes lisent
          # seulement le booléen, jamais la valeur du certificat.
          if ($env:WINDOWS_CERTIFICATE) { "present=true" >> $env:GITHUB_OUTPUT } else { "present=false" >> $env:GITHUB_OUTPUT }
      - name: Préparer le certificat de signature (facultatif)
        if: steps.release.outputs.ready != 'true' && steps.signing.outputs.present == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # Le secret contient le .pfx encodé en base64. Sans secret, le build
          # reste non signé : aucune étape ne doit échouer pour autant.
          $path = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "CSC_LINK=$path" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV
      - uses: ./.github/actions/build-effectcraft
        if: steps.release.outputs.ready != 'true'
      - name: Construire sans publier de fichiers intermédiaires
        if: steps.release.outputs.ready != 'true'
        run: npx electron-builder --win nsis --publish never --config.npmRebuild=false
        env:
          # true uniquement si le certificat est présent : CSC_LINK est alors
          # défini par l'étape précédente.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.present == 'true' && 'true' || 'false' }}
      - name: Empreintes et publication des exécutables
        if: steps.release.outputs.ready != 'true'
        shell: pwsh
        run: |
          $hashes = Get-ChildItem release/*-setup.exe | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $hashes | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
          # Explicit allowlist: portable executables remain local.
          $assets = @(Get-ChildItem release/*-setup.exe,release/*-setup.exe.blockmap,release/latest.yml,release/SHA256SUMS.txt | ForEach-Object { $_.FullName })
          gh release upload $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Vérifier que l'exécutable existe et se lance
        # Garde-fou : une régression du nom d'exécutable ne doit pas empêcher la
        # découverte d'un build cassé. Le test d'accessibilité lance l'application
        # empaquetée (doit produire exactement le nom de build.productName).
        if: steps.release.outputs.ready != 'true'
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: "1"
        run: node --test e2e/accessibility.e2e.test.js
      - name: Publier la release une fois les artefacts déposés
        # S'exécute aussi quand les artefacts existaient déjà : une exécution
        # précédente a pu laisser la fiche en brouillon.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $releaseJson = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($releaseJson -join ""))) { throw "Release $($env:RELEASE_TAG) introuvable" }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.isDraft) {
            Write-Host "La release $env:RELEASE_TAG est déjà publiée."
            exit 0
          }
          $names = @((gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json).assets | ForEach-Object { $_.name })
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $installer = $package.build.nsis.artifactName.Replace('${version}', $package.version)
          $required = @($installer, "$installer.blockmap", "latest.yml", "SHA256SUMS.txt")
          $missing = @($required | Where-Object { $_ -notin $names })
          if ($missing.Count -gt 0) { throw "Artefacts manquants : $($missing -join ', ')" }
          # Pas de splatting d'un tableau PowerShell vers gh : un tableau à un
          # élément est déroulé en chaîne, puis éclaté caractère par caractère
          # (« accepts 1 arg(s), received 9 »). Deux appels explicites.
          if ($release.isPrerelease) {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          } else {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Release $env:RELEASE_TAG publiée."
