name: Release Windows

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-windows-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run prepare:electron
      - name: Select version and create tag
        shell: pwsh
        id: version
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw "La version du paquet est invalide."
          }
          $existingTag = git ls-remote --tags origin "refs/tags/v$version"
          if ($LASTEXITCODE -ne 0) {
            throw "Impossible de vérifier les tags existants."
          }
          $bump = "false"
          if ($existingTag) {
            $version = (npm version patch --no-git-tag-version --ignore-scripts).TrimStart('v')
            if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Impossible d'incrémenter automatiquement la version du paquet."
            }
            $bump = "true"
          }
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "bump=$bump" >> $env:GITHUB_OUTPUT
      - run: npm run build:renderer
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never --config.npmRebuild=false
      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Un seul installateur NSIS était attendu dans release/."
          }
          $assets = @(
            $installers[0]
            Get-Item -LiteralPath "$($installers[0].FullName).blockmap" -ErrorAction Stop
            Get-Item -LiteralPath "release/latest.yml" -ErrorAction Stop
          )
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          Set-Content -LiteralPath "release/SHA256SUMS.txt" -Value $checksums -Encoding ascii
      - name: Push version commit and tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BUMP_VERSION: ${{ steps.version.outputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ($env:BUMP_VERSION -eq "true") {
            git add package.json
            git commit -m "chore: release $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw "Impossible de créer le commit de version $env:RELEASE_TAG." }
          }
          git tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Impossible de créer le tag $env:RELEASE_TAG." }
          git push --atomic origin "HEAD:main" "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Impossible de pousser le commit et le tag $env:RELEASE_TAG." }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $assets = @(
            Get-ChildItem release -Filter '*-setup.exe' -File
            Get-ChildItem release -Filter '*-setup.exe.blockmap' -File
            Get-Item -LiteralPath "release/latest.yml" -ErrorAction Stop
            Get-Item -LiteralPath "release/SHA256SUMS.txt" -ErrorAction Stop
          )
          if ($assets.Count -ne 4) {
            throw "La release doit contenir l'installateur, son blockmap, latest.yml et SHA256SUMS.txt."
          }
          $assetPaths = @($assets | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG $assetPaths --title $env:RELEASE_TAG --notes "Version $env:RELEASE_TAG." --verify-tag
