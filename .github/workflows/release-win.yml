name: Release Windows

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-windows-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run prepare:electron
      - name: Increment patch version and create tag
        shell: pwsh
        id: version
        run: |
          $tag = (npm version patch --no-git-tag-version --ignore-scripts).Trim()
          if ($LASTEXITCODE -ne 0 -or $tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Impossible d'incrémenter automatiquement la version du paquet."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - run: npm run build:renderer
      - name: Prepare Windows signing certificate
        id: signing
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw "Configure les secrets WIN_CSC_LINK et WIN_CSC_KEY_PASSWORD ensemble."
          }
          if (-not $hasCertificate) {
            Write-Warning "Certificat absent : cette release sera non signée. Configure les secrets WIN_CSC_LINK et WIN_CSC_KEY_PASSWORD."
            "csc_link=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          try {
            $certificateBytes = [Convert]::FromBase64String($env:WIN_CSC_LINK)
          } catch {
            throw "WIN_CSC_LINK doit contenir le certificat PFX encodé en Base64."
          }
          if ($certificateBytes.Length -eq 0) {
            throw "Le certificat PFX configuré dans WIN_CSC_LINK est vide."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          "csc_link=$certificatePath" >> $env:GITHUB_OUTPUT
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never --config.npmRebuild=false
        env:
          CSC_LINK: ${{ steps.signing.outputs.csc_link }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          if (Test-Path -LiteralPath $certificatePath) {
            Remove-Item -LiteralPath $certificatePath -Force
          }
      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Un seul installateur NSIS était attendu dans release/."
          }
          $assets = @(
            $installers[0]
            Get-Item -LiteralPath "$($installers[0].FullName).blockmap" -ErrorAction Stop
            Get-Item -LiteralPath "release/latest.yml" -ErrorAction Stop
          )
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          Set-Content -LiteralPath "release/SHA256SUMS.txt" -Value $checksums -Encoding ascii
      - name: Push version commit and tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Impossible de créer le commit de version $env:RELEASE_TAG." }
          git tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Impossible de créer le tag $env:RELEASE_TAG." }
          git push --atomic origin "HEAD:main" "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Impossible de pousser le commit et le tag $env:RELEASE_TAG." }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $assets = @(
            Get-ChildItem release -Filter '*-setup.exe' -File
            Get-ChildItem release -Filter '*-setup.exe.blockmap' -File
            Get-Item -LiteralPath "release/latest.yml" -ErrorAction Stop
            Get-Item -LiteralPath "release/SHA256SUMS.txt" -ErrorAction Stop
          )
          if ($assets.Count -ne 4) {
            throw "La release doit contenir l'installateur, son blockmap, latest.yml et SHA256SUMS.txt."
          }
          $assetPaths = @($assets | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG $assetPaths --title $env:RELEASE_TAG --generate-notes --verify-tag
